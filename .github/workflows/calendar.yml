name: Activity calendar

on:
  push:
    branches: [main]
    paths: [.github/workflows/calendar.yml]
  workflow_dispatch:
  schedule:
    - cron: '43 0 * * *'

permissions:
  contents: write

concurrency:
  group: activity-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Commit calendar entries
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          import os
          import subprocess
          from time import sleep
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo

          def git(*args, **kwargs):
              return subprocess.check_output(['git', *args], text=True, **kwargs)

          author = 'Mostakin Mondal <128492762+mostakin5290@users.noreply.github.com>'
          git('config', 'user.name', 'Activity Calendar Automation')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          existing = set(git('log', '--format=%s').splitlines())

          def record(label, day, *, entry=None):
              detail = f' (entry {entry})' if entry is not None else ''
              subject = f'{label}: {day}{detail}'
              if subject in existing:
                  return False
              git('commit', '--allow-empty', '--author', author,
                  '--date', f'{day}T06:00:00+05:30', '-m', subject)
              existing.add(subject)
              return True

          # Dates that showed zero contributions when the calendar was configured.
          historical_gaps = '''
          2025-11-26 2025-12-02 2025-12-12 2025-12-13 2025-12-15 2025-12-19 2025-12-20 2025-12-27
          2025-12-28 2025-12-30 2026-01-06 2026-01-11 2026-01-12 2026-01-15 2026-01-16 2026-01-23
          2026-01-26 2026-01-31 2026-02-05 2026-02-11 2026-02-12 2026-02-21 2026-02-24 2026-02-26
          2026-02-27 2026-02-28 2026-03-01 2026-03-02 2026-03-03 2026-03-04 2026-03-05 2026-03-06
          2026-03-07 2026-03-08 2026-03-09 2026-03-10 2026-03-11 2026-03-12 2026-03-13 2026-03-14
          2026-03-15 2026-03-17 2026-03-18 2026-03-19 2026-03-20 2026-03-21 2026-03-22 2026-03-23
          2026-03-24 2026-03-25 2026-03-26 2026-03-27 2026-03-28 2026-03-29 2026-03-30 2026-03-31
          2026-04-01 2026-04-02 2026-04-03 2026-04-04 2026-04-08 2026-04-10 2026-04-12 2026-04-13
          2026-04-19 2026-04-20 2026-04-21 2026-04-22 2026-04-23 2026-04-24 2026-04-25 2026-04-27
          2026-04-28 2026-04-29 2026-04-30 2026-05-01 2026-05-02 2026-05-03 2026-05-04 2026-05-05
          2026-05-06 2026-05-09 2026-05-10 2026-05-12 2026-05-13 2026-05-14 2026-05-15 2026-05-16
          2026-05-17 2026-05-18 2026-05-19 2026-05-20 2026-05-21 2026-05-22 2026-05-23 2026-05-24
          2026-05-25 2026-05-26 2026-05-27 2026-05-28 2026-05-29 2026-05-30 2026-05-31 2026-06-03
          2026-06-05 2026-06-06 2026-06-07 2026-06-08 2026-06-11 2026-06-12 2026-06-13 2026-06-14
          2026-06-15 2026-06-16 2026-06-17 2026-06-18 2026-06-19 2026-06-20 2026-06-21 2026-06-22
          2026-06-23 2026-06-24 2026-06-25 2026-06-26 2026-06-27 2026-06-28 2026-06-29 2026-06-30
          2026-07-01 2026-07-02 2026-07-03 2026-07-04 2026-07-05 2026-07-06 2026-07-07 2026-07-08
          2026-07-09 2026-07-10 2026-07-11 2026-07-12 2026-07-13 2026-07-14 2026-07-15 2026-07-16
          2026-07-17 2026-07-18 2026-07-19 2026-07-20 2026-07-21 2026-07-22 2026-07-23 2026-07-24
          2026-07-25 2026-07-26 2026-07-27 2026-07-28 2026-07-29 2026-07-30 2026-07-31 2026-08-01
          2026-08-02 2026-08-03 2026-08-04 2026-08-05 2026-08-06 2026-08-07 2026-08-08 2026-08-09
          2026-08-10 2026-08-11 2026-08-12 2026-08-13 2026-08-14 2026-08-15 2026-08-16 2026-08-17
          2026-08-18 2026-08-19 2026-08-20 2026-08-21 2026-08-22 2026-08-23 2026-08-24 2026-08-25
          2026-08-26 2026-08-27 2026-08-28 2026-08-29 2026-08-30 2026-08-31 2026-09-01 2026-09-02
          2026-09-03 2026-09-04 2026-09-05 2026-09-06 2026-09-07 2026-09-08 2026-09-09 2026-09-10
          2026-09-11 2026-09-14 2026-09-15 2026-09-17 2026-09-18 2026-09-19 2026-09-20 2026-09-21
          2026-09-22 2026-09-23 2026-09-24 2026-09-26 2026-09-27 2026-09-28 2026-09-29 2026-09-30
          2026-10-01 2026-10-02 2026-10-03 2026-10-04 2026-10-05 2026-10-06 2026-10-07 2026-10-08
          2026-10-10 2026-10-13 2026-10-15 2026-10-17 2026-10-20 2026-10-21 2026-10-22 2026-10-23
          2026-10-24 2026-10-25 2026-10-26 2026-10-27 2026-10-29 2026-10-30 2026-10-31 2026-11-01
          2026-11-02 2026-11-03 2026-11-04 2026-11-05 2026-11-06 2026-11-07 2026-11-08 2026-11-09
          2026-11-10 2026-11-11 2026-11-12 2026-11-13 2026-11-14 2026-11-15 2026-11-16 2026-11-17
          2026-11-18 2026-11-19 2026-11-20 2026-11-21 2026-11-22
          '''.split()
          # Keep the count stable across retries, with 2–4 entries more common.
          counts = (1, 2, 2, 3, 3, 3, 4, 4, 4, 5, 6, 7, 8)
          for day in historical_gaps:
              record('Calendar backfill', day)
              date_hash = sha256(day.encode('ascii')).digest()
              target = counts[int.from_bytes(date_hash[:4], 'big') % len(counts)]
              for entry in range(2, target + 1):
                  record('Calendar backfill', day, entry=entry)

          # The 84 letter cells, with their contribution counts before this backfill.
          letter_cells = {
              '2026-03-30': 4,
              '2026-04-27': 3,
              '2026-05-11': 2,
              '2026-05-18': 5,
              '2026-05-25': 3,
              '2026-06-08': 4,
              '2026-06-15': 1,
              '2026-06-22': 3,
              '2026-07-06': 4,
              '2026-07-13': 1,
              '2026-07-20': 6,
              '2026-08-10': 2,
              '2026-08-31': 1,
              '2026-09-14': 7,
              '2026-09-28': 3,
              '2026-10-05': 8,
              '2026-10-12': 1,
              '2026-10-26': 3,
              '2026-11-16': 3,
              '2026-03-31': 7,
              '2026-04-07': 1,
              '2026-04-21': 3,
              '2026-04-28': 2,
              '2026-05-12': 2,
              '2026-05-26': 7,
              '2026-06-09': 6,
              '2026-07-14': 3,
              '2026-08-04': 6,
              '2026-08-18': 8,
              '2026-09-01': 1,
              '2026-09-15': 7,
              '2026-10-06': 4,
              '2026-10-27': 3,
              '2026-11-03': 3,
              '2026-11-17': 2,
              '2026-04-01': 6,
              '2026-04-15': 4,
              '2026-04-29': 4,
              '2026-05-13': 3,
              '2026-05-27': 8,
              '2026-06-10': 2,
              '2026-06-17': 4,
              '2026-06-24': 6,
              '2026-07-15': 4,
              '2026-08-05': 6,
              '2026-08-12': 3,
              '2026-08-19': 4,
              '2026-09-02': 3,
              '2026-09-09': 6,
              '2026-10-07': 4,
              '2026-10-28': 14,
              '2026-11-11': 1,
              '2026-11-18': 4,
              '2026-04-02': 1,
              '2026-04-30': 2,
              '2026-05-14': 3,
              '2026-05-28': 3,
              '2026-06-25': 3,
              '2026-07-16': 4,
              '2026-08-06': 1,
              '2026-08-20': 5,
              '2026-09-03': 8,
              '2026-09-17': 7,
              '2026-10-08': 2,
              '2026-10-29': 1,
              '2026-11-19': 3,
              '2026-04-03': 2,
              '2026-05-01': 4,
              '2026-05-15': 1,
              '2026-05-22': 8,
              '2026-05-29': 3,
              '2026-06-12': 3,
              '2026-06-19': 8,
              '2026-06-26': 8,
              '2026-07-17': 8,
              '2026-08-07': 4,
              '2026-08-21': 3,
              '2026-09-04': 3,
              '2026-09-18': 3,
              '2026-10-02': 5,
              '2026-10-09': 2,
              '2026-10-16': 1,
              '2026-10-30': 3,
              '2026-11-20': 1,
          }
          for day, baseline in sorted(letter_cells.items()):
              for entry in range(1, 32 - baseline + 1):
                  record('MOSTAKIN calendar art', day, entry=entry)

          # Raise the selected letter cells to at least the calibrated count.
          corrections = {
              '2026-04-27': 21,
              '2026-04-28': 45,
          }
          unpushed = 0
          for day, count in corrections.items():
              for entry in range(1, count + 1):
                  if record('MOSTAKIN shade correction', day, entry=entry):
                      unpushed += 1
                  if unpushed == 100:
                      git('push', 'origin', 'HEAD:refs/heads/main')
                      unpushed = 0
                      sleep(6)

          today = datetime.now(ZoneInfo('Asia/Kolkata')).date()
          start = date(2026, 11, 24)
          for offset in range((today - start).days + 1):
              record('Daily calendar update', start + timedelta(days=offset))

          base = os.environ['GITHUB_SHA']
          if git('rev-parse', 'HEAD').strip() != base:
              git('push', 'origin', 'HEAD:refs/heads/main')
          PY
